pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

// Centralized repository configuration.
//
// PREFER_SETTINGS makes these repositories authoritative for ALL projects
// (root + subprojects + autolinked native modules), so libraries that
// declare their own `repositories { google(); mavenCentral() }` blocks
// still resolve correctly. Any node_modules library that ships an
// artifact via a bundled local Maven repo (instead of Maven Central)
// must be added here — otherwise dependency resolution fails with
// "Could not find <artifact>". Currently required by:
//   - @react-native-async-storage/async-storage v3+
//     (org.asyncstorage.shared_storage:storage-android)
//   - @notifee/react-native
//     (app.notifee:core, shipped under android/libs/)
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    google()
    mavenCentral()
    maven { url = uri("../node_modules/@react-native-async-storage/async-storage/android/local_repo") }
    maven { url = uri("../node_modules/@notifee/react-native/android/libs") }
  }
}

rootProject.name = 'LA'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
