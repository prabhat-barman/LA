name: Distribute Android beta

# Push to main → build release APK → upload to Firebase App Distribution.
# Skipped for docs-only / iOS-only / CI-only changes to save build time.
# Can also be triggered manually from the Actions tab.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'ios/**'
      - '.github/**'
      - 'doc/**'
      - 'docs/**'
  workflow_dispatch:

# Never run two Android distribute jobs in parallel — Firebase would just
# race on the same release, wasting build minutes. Newer pushes wait.
concurrency:
  group: android-distribute
  cancel-in-progress: false

jobs:
  distribute:
    name: Build APK and upload to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --no-audit --loglevel=error

      # google-services.json is not in the repo (it's per-environment). CI
      # gets it from the GOOGLE_SERVICES_JSON secret (base64-encoded). If
      # the secret isn't set, the Gradle build still runs but Firebase
      # plugins stay off and the app ID lookup below will fail with a
      # clear message.
      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "Wrote android/app/google-services.json ($(wc -c < android/app/google-services.json) bytes)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — Firebase plugins will be skipped and distribute will fail without an app ID."
          fi

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate output APK
        id: apk
        run: |
          # LA's android/app/build.gradle enables ABI splits with
          # universalApk=true, so the artifact we ship to testers is the
          # universal APK. Fall back to app-release.apk if splits are
          # ever disabled so the workflow keeps working.
          APK=""
          for candidate in \
            android/app/build/outputs/apk/release/app-universal-release.apk \
            android/app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced. Contents of android/app/build/outputs/apk/release:"
            ls -la android/app/build/outputs/apk/release/ 2>&1 || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Selected APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Resolve Firebase Android app ID
        id: appid
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          # Prefer google-services.json (single source of truth) but let a
          # FIREBASE_ANDROID_APP_ID secret override for teams that never
          # commit / restore the config file.
          if [ -f android/app/google-services.json ]; then
            APP_ID=$(node -pe "require('./android/app/google-services.json').client[0].client_info.mobilesdk_app_id")
          fi
          if [ -z "${APP_ID:-}" ] && [ -n "$FIREBASE_ANDROID_APP_ID" ]; then
            APP_ID="$FIREBASE_ANDROID_APP_ID"
          fi
          if [ -z "${APP_ID:-}" ]; then
            echo "::error::Could not resolve Firebase Android app ID. Either add GOOGLE_SERVICES_JSON (base64) or FIREBASE_ANDROID_APP_ID as a repo secret. See DISTRIBUTION.md."
            exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Using app ID: $APP_ID"

      - name: Generate release notes from git
        run: |
          {
            echo "LA — automated build from main"
            echo ""
            echo "Latest commit:"
            git log -1 --pretty=format:"  %h %s%n%n%b"
          } > "$RUNNER_TEMP/release-notes.txt"
          echo "----- release notes -----"
          cat "$RUNNER_TEMP/release-notes.txt"
          echo "-------------------------"

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APP_ID: ${{ steps.appid.outputs.app_id }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT secret. See DISTRIBUTION.md."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          # Diagnostic: print which service account + project the secret
          # points at. These identifiers are NOT secret (they're visible on
          # the GCP IAM page). If distribute fails with 403, this tells us
          # exactly which principal needs "Firebase App Distribution Admin".
          echo "----- service account identity -----"
          node -e '
            const sa = require(process.env.GOOGLE_APPLICATION_CREDENTIALS);
            console.log("client_email :", sa.client_email);
            console.log("project_id   :", sa.project_id);
            console.log("type         :", sa.type);
          '
          echo "------------------------------------"

          npx --yes firebase-tools appdistribution:distribute \
            "$APK_PATH" \
            --app "$APP_ID" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt" \
            --groups testers

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
